name: Dynamic OKF Knowledge Updater

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: okf-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-okf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run OKF Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python src/knowledge_engine/okf_updater.py
          
      - name: Commit and Push OKF Updates Directly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          if git diff --staged --quiet; then
            echo "No OKF changes detected."
          else
            git commit -m "chore(okf): autonomous update of macroeconomic policy rules via Gemini AI"
            git pull --rebase origin master
            git push origin master
          fi

