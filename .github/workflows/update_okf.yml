name: Dynamic OKF Knowledge Updater

on:
  schedule:
    # Run once daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: okf-updater
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-okf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run OKF Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          python src/knowledge_engine/okf_updater.py
          
      - name: Create Pull Request for OKF Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(okf): update macroeconomic policy rules via Gemini AI"
          title: "Macro Regime Update: Autonomous OKF Policy Rules Review"
          body: |
            ### Objective Knowledge Framework (OKF) Automated Review
            This pull request contains macroeconomic policy and central bank stance updates dynamically generated by Google Gemini.
            
            **Review Checklist:**
            - [ ] Verify that interest rate decisions match actual central bank publications.
            - [ ] Check that Hawkish/Dovish stance changes reflect real statements.
            - [ ] Ensure no hallucinated reversals or formatting corruptions exist.
          branch: okf-update-bot
          delete-branch: true
