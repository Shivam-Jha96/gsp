name: Global Macro-Sentiment Pipeline

on:
  schedule:
    # Run every 2 hours (Balances data freshness while staying under GitHub/Gemini Free Tier limits)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Execute Pipeline (Ingestion -> AI -> DB -> Trading)
        env:
          # These environment variables are securely injected from GitHub Secrets
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONPATH: src
        run: |
          python src/main.py
