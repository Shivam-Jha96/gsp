name: Update Index Constituents

on:
  schedule:
    # Run every 1st and 15th of the month at midnight UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-constituents:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Update Script
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python scripts/update_constituents.py
        
      - name: Commit and Push Constituents Updates Directly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          if git diff --staged --quiet; then
            echo "No constituent changes detected."
          else
            git commit -m "chore(knowledge): autonomous fortnightly update of index constituents"
            git pull --rebase origin master
            git push origin master
          fi

