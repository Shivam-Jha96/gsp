name: Update Index Constituents

on:
  schedule:
    # Run every 1st and 15th of the month at midnight UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-constituents:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Update Script
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python scripts/update_constituents.py
        
      - name: Create Pull Request for Constituents Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(knowledge): fortnightly automated update of index constituents"
          title: "Index Constituents Update: Fortnightly Rebalance Review"
          body: |
            ### Automated Index Constituents Update
            This pull request contains updated market index constituents dynamically refreshed by the constituent synchronization engine.
            
            **Review Checklist:**
            - [ ] Verify additions/deletions against regional stock exchange rebalance announcements.
            - [ ] Ensure JSON structure integrity across `knowledge/*_constituents.okf.json`.
          branch: constituents-update-bot
          delete-branch: true
