name: Database Integrity, Deduplication & Sentiment Re-scoring

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: dry-run (preview), purge (delete contaminants), dedup (purge redundant duplicates), rescore (recalibrate sentiment), full-clean (all)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - dedup
          - purge
          - rescore
          - full-clean

jobs:
  audit-and-reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Execute Maintenance Routine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/reclassify_database.py --mode=${{ github.event.inputs.mode }}
